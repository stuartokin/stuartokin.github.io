name: Seal hidden cards

# Cards marked "hidden": true in tools/boards.json are never written into the page. This workflow
# seals them into sealed.json with the HUB_UNLOCK_KEY secret (tools/seal.py); js/unlock.js shows them to
# whoever enters that key in the ⓘ panel or opens a link ending #key=….
# Runs when the cards change, and by hand (Actions → Seal hidden cards → Run workflow) — run it by hand
# after adding or changing the secret, because changing a secret doesn't start workflows on its own.
# No AI and no cost. Only sealed.json is ever changed.
on:
  push:
    branches: [main]
    paths:
      - tools/boards.json
      - tools/build.py
      - tools/seal.py
      - .github/workflows/seal.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: seal
  cancel-in-progress: false

jobs:
  # ---- Kill switch -------------------------------------------------------
  # Reads two small files before anything else runs:
  #   master: stuartokin.github.io/automation.json  (turns off every app)
  #   local:  automation.json at the top of this repo (turns off this app)
  # If either says "paused": true, automatic runs (schedule, issues,
  # comments, other workflows) stop here and change nothing. Runs started by
  # hand ("Run workflow") and your own uploads always go ahead.
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        name: Check the kill switches
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          flag() {
            local v
            v=$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$1?t=$(date +%s)" 2>/dev/null | jq -r '.paused' 2>/dev/null) || v=""
            case "$v" in true|false) echo "$v" ;; null) echo false ;; *) echo unknown ;; esac
          }
          MASTER=$(flag "https://raw.githubusercontent.com/stuartokin/stuartokin.github.io/main/automation.json")
          LOCAL=$(flag "https://raw.githubusercontent.com/$REPO/$SHA/automation.json")
          echo "Master switch (stuartokin.github.io/automation.json): paused = $MASTER"
          echo "This repo's switch (automation.json): paused = $LOCAL"
          GO=true
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "push" ]; then
            if [ "$MASTER" = "true" ] || [ "$LOCAL" = "true" ]; then
              echo "::notice title=Kill switch::A switch is set to paused, but this run was started by hand or by an upload, so it goes ahead."
            fi
          elif [ "$MASTER" = "true" ]; then
            GO=false
            echo "::notice title=Kill switch::Paused by master switch (stuartokin.github.io/automation.json). Nothing was changed."
          elif [ "$LOCAL" = "true" ]; then
            GO=false
            echo "::notice title=Kill switch::Paused by this repo's switch (automation.json). Nothing was changed."
          fi
          if [ "$MASTER" = "unknown" ]; then
            echo "::warning title=Kill switch::Could not read the master switch, so carrying on as normal."
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "Kill switch: master paused = $MASTER, this repo paused = $LOCAL, event = $EVENT, go = $GO" >> "$GITHUB_STEP_SUMMARY"

  seal:
    needs: switch
    if: needs.switch.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet cryptography
      - name: Seal the hidden cards
        env:
          HUB_UNLOCK_KEY: ${{ secrets.HUB_UNLOCK_KEY }}
        run: |
          python3 tools/seal.py | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$HUB_UNLOCK_KEY" ]; then
            echo "::warning title=No key::Add the HUB_UNLOCK_KEY secret (Settings → Secrets and variables → Actions), then run this workflow by hand. Until then hidden cards stay hidden for everyone."
          fi
      - name: Save sealed.json
        id: save
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- sealed.json; then echo "No change."; exit 0; fi
          git config user.name "seal-bot"
          git config user.email "seal-bot@users.noreply.github.com"
          git add sealed.json
          git commit -m "Seal hidden cards"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Republish the site
        if: steps.save.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages will rebuild on its own"
